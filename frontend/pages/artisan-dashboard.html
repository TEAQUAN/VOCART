<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artisan Dashboard</title>
    <link rel="stylesheet" href="../assets/css/artisan-dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header class="dashboard-header">
        <h1>Welcome, <span id="artisan-name">Artisan</span></h1>
        <button id="logout-btn" class="btn-logout">Logout</button>
    </header>
    
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="profile-section">
                <img id="profile-pic" src="../assets/images/download (1).png" alt="Profile Picture" class="profile-img">
                <h2 id="artisan-name-display">Artisan Name</h2>
                <h2 id="artisan-name-displayed">Artisan Name</h2>
                <p id="artisan-location" class="artisan-location"><i class="fas fa-map-marker-alt"></i> Location</p>
                <p id="artisan-skills" class="artisan-skills"><i class="fas fa-tools"></i> Skills</p>
            </div>
        </aside>
        
        <main class="main-content">
            <h2>Job Requests</h2>
            <div id="job-list" class="job-list">
                <!-- Job requests will be dynamically loaded here -->
            </div>
        </main>
    </div>

    <script src="../assets/js/artisan-dashboards.js"></script>
</body>
</html>
